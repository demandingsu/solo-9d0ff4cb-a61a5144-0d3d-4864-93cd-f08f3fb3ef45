services:
  calibration-api:
    build: .
    image: coldchain-calibration:latest
    container_name: coldchain-calibration
    ports:
      - "8000:8000"
    environment:
      CAL_DB_PATH: /data/calibration.db
    volumes:
      - calibration-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  calibration-data:
